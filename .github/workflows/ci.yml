name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a newer push to the same branch or PR cancels the run it supersedes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # version comes from "packageManager" in package.json; must run before setup-node for the pnpm cache
      - uses: pnpm/action-setup@v6

      # node:sqlite needs Node 22.5+; 24 matches the Docker image
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # pnpm eval:scoring is paid and runs on request only (AGENTS.md), never here
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
